/* ===== 日期工具 ===== */
function todayTW(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);}
function md(s){const [,m,d]=s.split('-');return (+m)+'/'+(+d);}
function wd(s){return '日一二三四五六'[new Date(s+'T00:00:00Z').getUTCDay()];}
LESSONS.forEach((L,i)=>{L.date=addDays(CONFIG.START,i);L.stories=(L.s||[]).map(x=>({lb:x[0],how:x[1],e:x[2]}));if(i>=6&&i<=24){const q=QA[i-6],f=FB[(i-6)%7];L.stories.push({lb:'反饋分享｜'+f[0],how:FB_HOW+'（先發這則，讓客人對號入座）',e:f[1]},{lb:'每日 QA '+(i-5)+'｜'+q[0],how:'回答重點：'+q[2]+'（接在反饋後面，幫客人解除疑慮）',e:q[1]+'\n\n我的回答：'+q[3]});}L.teacher=i===25?'雅芸':TEACHERS[i%7];L.phase=PHASES.find(p=>i>=p[0]&&i<=p[1]);L.sale=L.date>=CONFIG.SALE_START&&L.date<=CONFIG.SALE_END;});
const TOTAL = LESSONS.length;

/* ===== 狀態 ===== */
function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function save(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const S={data:{members:[],checkins:[],lessons:[],highlights:[]},me:load('pf_me'),pass:load('pf_pass')||'',view:'home',openDay:null,adminDay:null,authMode:'register',demoDate:load('pf_demoDate')||'',loading:true,msg:{},busy:false,cheered:load('pf_cheered')||{},teacher:load('pf_teacher')||'',proofFiles:[],proofs:{}};
function today(){return (!CONFIG.API&&S.demoDate)?S.demoDate:todayTW();}
function todayIdx(){return diffDays(CONFIG.START,today());}

/* ===== 示範模式（沒有 API 時，資料存在這台裝置） ===== */
const DEMO_IMG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="260"><rect width="200" height="260" fill="#f1e9fb"/><text x="100" y="135" font-size="18" text-anchor="middle" fill="#6a3fa0">示範訂單截圖</text></svg>');
const Mock={
  db(){return load('pf_demo')||{members:[],checkins:[],lessons:[],highlights:[]};},
  put(d){save('pf_demo',d);},
  pub(d){return {ok:true,members:d.members.map(m=>({id:m.id,name:m.name,team:m.team})),checkins:d.checkins.map(c=>{const o=Object.assign({},c);o.hasProof=c.proof&&c.proof.length?'1':'';delete o.proof;return o;}),lessons:d.lessons,highlights:d.highlights};},
  all(){return this.pub(this.db());},
  post(a,p){
    const d=this.db(),now=new Date().toISOString(),name=String(p.name||'').trim(),pin=String(p.pin||'');
    const up=(arr,keyF,obj)=>{const i=arr.findIndex(x=>x[keyF]===obj[keyF]);if(i>=0)arr[i]=Object.assign(arr[i],obj);else arr.push(obj);};
    let r={ok:true};
    if(a==='register'){
      if(!name||!/^\d{4}$/.test(pin))return{ok:false,error:'請填姓名和 4 位數字密碼'};
      if(d.members.some(m=>m.name===name))return{ok:false,error:'這個名字已經報名了，請直接登入'};
      if(d.members.length>=CONFIG.MAX)return{ok:false,error:'名額已滿，下次早點報名喔！'};
      const m={id:Math.random().toString(36).slice(2,10),name,team:'',pin,line:p.line||'',createdAt:now};d.members.push(m);r.me={id:m.id,name:m.name,team:m.team};
    }else if(a==='login'){
      const m=d.members.find(x=>x.name===name&&x.pin===pin);if(!m)return{ok:false,error:'姓名或密碼不對'};r.me={id:m.id,name:m.name,team:m.team};
    }else if(a==='checkin'){
      const m=d.members.find(x=>x.id===p.memberId&&x.pin===pin);if(!m)return{ok:false,error:'請重新登入'};
      const t=today();if(t<CONFIG.START||t>CONFIG.END)return{ok:false,error:'現在不在打卡期間（示範模式可以在上方切換模擬日期）'};
      if(!String(p.note||'').trim())return{ok:false,error:'請填寫今日作業／心得'};
      const key=t+'|'+m.id,old=d.checkins.find(c=>c.key===key),deals=Math.max(0,parseInt(p.deals)||0);
      let proof=old&&old.proof||[];if(p.proofs&&p.proofs.length)proof=p.proofs.slice(0,3).map(b=>'data:image/jpeg;base64,'+b);
      if(deals>0&&!proof.length)return{ok:false,error:'成交組數要附上訂單截圖當證據喔'};
      up(d.checkins,'key',{key,date:t,memberId:m.id,name:m.name,team:'',story:p.story?'1':'',note:String(p.note).trim(),deals:String(deals),proof,cheers:old?old.cheers:'0',updatedAt:now});
    }else if(a==='cheer'){
      const c=d.checkins.find(x=>x.key===p.key);if(c)c.cheers=String((+c.cheers||0)+1);
    }else{
      if(p.pass!=='1234')return{ok:false,error:'後台密碼不對（示範模式密碼是 1234）'};
      if(a==='proofs'){const map={};d.checkins.forEach(c=>{if(c.proof&&c.proof.length)map[c.key]=c.proof.map(u=>({url:u,thumb:u}));});return Object.assign(this.pub(d),{ok:true,proofs:map});}
      if(a==='feedback'){const c=d.checkins.find(x=>x.key===p.key);if(!c)return{ok:false,error:'找不到這份作業'};c.fb=String(p.text||'');c.fbBy=p.by||'';c.fbAt=now;}
      if(a==='saveLesson')up(d.lessons,'day',{day:String(p.day),video:p.video||'',extra:p.extra||'',updatedAt:now});
      if(a==='setHighlight'){const key=p.date+'|'+p.memberId;if(p.on)up(d.highlights,'key',{key,date:p.date,memberId:p.memberId,name:p.name,text:p.text||'',updatedAt:now});else d.highlights=d.highlights.filter(h=>h.key!==key);}
    }
    this.put(d);return Object.assign(this.pub(d),r);
  },
  seed(){
    const names=['小美','Amber','佳佳','Momo','阿蓁','Vivi','小魚','Jenny','芊芊','Lulu','安安','Cindy'];
    const notes=['今天終於鼓起勇氣發了第一則限動！','以前下午一定要手搖，現在換成可可🍫','拍了紫肽飲影片，朋友問我在哪買💜','名單列好了，明天開始私訊','今天有 2 位朋友回覆我的限動！'];
    const d=this.db();d.members=d.members.filter(m=>!String(m.id).startsWith('demo'));d.checkins=d.checkins.filter(c=>!String(c.memberId).startsWith('demo'));const t=today();
    names.forEach((n,i)=>{const m={id:'demo'+i,name:n,team:'',pin:'0000',line:'',createdAt:''};d.members.push(m);
      for(let k=0;k<TOTAL;k++){const dt=LESSONS[k].date;if(dt>t)break;if(Math.random()<.18&&i>2)continue;
        const dl=LESSONS[k].sale?Math.floor(Math.random()*3):0;d.checkins.push({key:dt+'|'+m.id,date:dt,memberId:m.id,name:n,team:'',story:'1',note:notes[(i+k)%notes.length],deals:String(dl),proof:dl?[DEMO_IMG]:[],cheers:String(Math.floor(Math.random()*6)),updatedAt:''});}});
    this.put(d);
  }
};

/* ===== API ===== */
async function apiAll(){
  if(!CONFIG.API)return Mock.all();
  const r=await fetch(CONFIG.API+'?action=all');return r.json();
}
async function apiPost(action,payload){
  if(!CONFIG.API)return Mock.post(action,payload||{});
  const r=await fetch(CONFIG.API,{method:'POST',body:JSON.stringify(Object.assign({action},payload||{}))});return r.json();
}
function apply(res){if(res&&res.members){S.data={members:res.members||[],checkins:res.checkins||[],lessons:res.lessons||[],highlights:res.highlights||[]};}}
async function refresh(){
  try{const res=await apiAll();apply(res);S.loadErr='';}
  catch(e){S.loadErr='連線失敗，請檢查網路後重新整理';}
  S.loading=false;render();
}

/* ===== 計算 ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function elapsed(){const i=todayIdx();if(i<0)return 0;return Math.min(i+1,TOTAL);}
function myCheckin(date){return S.me&&S.data.checkins.find(c=>c.memberId===S.me.id&&c.date===date);}
function memberStats(){
  const t=today(),el=elapsed();
  return S.data.members.map(m=>{
    const cs=S.data.checkins.filter(c=>c.memberId===m.id&&c.date<=t);
    const days=new Set(cs.map(c=>c.date)).size;
    const deals=cs.reduce((a,c)=>a+(parseInt(c.deals)||0),0);
    return {...m,days,deals,full:el>0&&days>=el};
  });
}
function override(i){return S.data.lessons.find(l=>String(l.day)===String(i+1))||{};}
function ytLabel(u){return u.length>42?u.slice(0,42)+'…':u;}

    ${noStory.length?`<div style="font-size:14px">📱 未發限動 ${noStory.length} 人：${noStory.map(esc).join('、')}</div>`:''}
    <button class="btn sm ghost" style="margin-top:6px" data-act="copyMissing" data-i="${i}">複製提醒文字（貼到 LINE）</button></div>`;}
  const tally=S.data.members.map(m=>{const ds=new Set(S.data.checkins.filter(c=>c.memberId===m.id&&c.date<=LESSONS[last].date).map(c=>c.date));return{name:m.name,miss:last+1-ds.size};}).filter(x=>x.miss>0).sort((a,b)=>b.miss-a.miss);
  return `<div class="card"><h3>📋 每日未完成名單</h3><div class="muted">未打卡＝當天沒交作業；未發限動＝有打卡但沒勾「已發限動」</div>${rows}</div>
  <div class="card"><h3>📊 累計缺卡（${tally.length} 人）</h3>${tally.length?tally.map(x=>`<div class="row"><div class="grow"><b>${esc(x.name)}</b></div><span class="muted">缺 ${x.miss} 天</span></div>`).join(''):'<p class="muted">目前全員全勤 🏅</p>'}</div>`;
}
function fbBox(c){return c&&c.fb?`<div class="fbbox"><b>💬 ${esc(c.fbBy||'講師')} 老師回饋</b><div style="white-space:pre-wrap">${esc(c.fb)}</div></div>`:'';}
function proofHtml(c){
  const ps=S.proofs[c.key];
  if(!ps)return `<div class="muted" style="font-size:12.5px">${c.hasProof?'📎 證據載入中…':'⚠️ 沒有附證據'}</div>`;
  return `<div class="proofs">${ps.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.thumb)}" alt="訂單截圖"></a>`).join('')}</div><div class="muted" style="font-size:12px">📎 成交證據（點圖看大圖）</div>`;
}
async function loadProofs(){
  try{const r=await apiPost('proofs',{pass:S.pass});if(r.ok&&r.proofs){S.proofs=r.proofs;if(S.view==='admin')render();}}catch(e){}
}
/* ===== 互動 ===== */
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200);}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  const a=el.dataset.act;
  if(a==='tab'){S.view=el.dataset.v;if(S.view==='admin')S.proofsLoaded=false;S.openDay=null;S.msg={};render();window.scrollTo(0,0);refresh();}
  else if(a==='toForm'){const f=document.getElementById('regform');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='authMode'){S.authMode=el.dataset.v;S.msg={};S.authDraft=null;render();}
  else if(a==='logout'){S.me=null;save('pf_me',null);S.view='home';render();}
  else if(a==='openDay'){S.openDay=+el.dataset.i;S.msg={};render();window.scrollTo(0,0);}
  else if(a==='closeDay'){S.openDay=null;render();}
  else if(a==='copy'){const st=LESSONS[+el.dataset.i].stories[+el.dataset.s];try{await navigator.clipboard.writeText(st.e);toast('已複製，貼到限動吧 💜');}catch(err){toast('無法自動複製，請長按文字複製');}}
  else if(a==='cheer'){const k=el.dataset.k;if(S.cheered[k])return;S.cheered[k]=1;save('pf_cheered',S.cheered);const c=S.data.checkins.find(x=>x.key===k);if(c)c.cheers=String((parseInt(c.cheers)||0)+1);render();try{const r=await apiPost('cheer',{key:k});if(r.ok)apply(r);}catch(err){}}
  else if(a==='hl'){const c=S.data.checkins.find(x=>x.key===el.dataset.k);if(!c)return;const on=!S.data.highlights.some(x=>x.date===c.date&&x.memberId===c.memberId);await post('setHighlight',{pass:S.pass,date:c.date,memberId:c.memberId,name:c.name,text:c.note.slice(0,300),on},'hl',on?'已設為亮點 ⭐':'已取消亮點');}
  else if(a==='copyMissing'){try{await navigator.clipboard.writeText(missingText(+el.dataset.i));toast('已複製，貼到 LINE 群提醒 💜');}catch(err){toast('無法自動複製');}}
  else if(a==='adminOut'){S.pass='';save('pf_pass',null);S.proofs={};S.proofsLoaded=false;render();}
  else if(a==='seed'){Mock.seed();toast('已塞入 12 位示範夥伴');refresh();}
  else if(a==='wipe'){save('pf_demo',null);save('pf_me',null);save('pf_cheered',null);S.me=null;S.cheered={};toast('已清空示範資料');refresh();}
});
function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',0.72));};img.onerror=()=>rej();img.src=u;});}
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.matches('[data-proof]')){
    const files=[...el.files].filter(f=>f.type.startsWith('image/')).slice(0,3);
    const prev=document.getElementById('proofPrev');
    try{S.proofFiles=await Promise.all(files.map(compress));}catch(err){S.proofFiles=[];toast('圖片讀取失敗，請換一張');}
    if(prev)prev.innerHTML=S.proofFiles.map(u=>`<img src="${u}" alt="">`).join('');
    return;
  }
  if(el.dataset.act==='demoDate'){S.demoDate=el.value;S.ckDraft=null;S.proofFiles=[];save('pf_demoDate',el.value||null);S.adminDay=null;S.openDay=null;render();}
  if(el.dataset.act==='teacher'){S.teacher=el.value;save('pf_teacher',el.value||null);return;}
  if(el.dataset.act==='adminDay'){S.adminDay=+el.value;S.msg={};S.proofsLoaded=false;render();}
});
async function post(action,payload,msgKey,okText){
  S.busy=true;S.msg={};render();
  let r;try{r=await apiPost(action,payload);}catch(err){r={ok:false,error:'連線失敗，請再試一次'};}
  S.busy=false;
  if(r.ok){apply(r);S.msg[msgKey]={ok:okText};if(okText)toast(okText);}
  else S.msg[msgKey]={err:r.error||'發生錯誤'};
  render();return r;
}
document.addEventListener('submit',async e=>{
  const f=e.target,kind=f.dataset.form;if(!kind)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f));
  if(kind==='register'||kind==='login'){
    S.authDraft={name:fd.name,line:fd.line};S.busy=true;S.msg={};render();
    let r;try{r=await apiPost(kind,fd);}catch(err){r={ok:false,error:'連線失敗，請再試一次'};}
    S.busy=false;
    if(r.ok){apply(r);S.authDraft=null;S.me=Object.assign({},r.me,{pin:fd.pin});save('pf_me',S.me);toast(kind==='register'?'報名成功！11/13 見 💜':'歡迎回來 💜');}
    else S.msg.auth=r.error||'發生錯誤';
    render();
  }else if(kind==='checkin'){
    const old=myCheckin(today());S.ckDraft={date:today(),note:fd.note,deals:fd.deals||'',story:!!fd.story};
    if((parseInt(fd.deals)||0)>0&&!S.proofFiles.length&&!(old&&old.hasProof)){S.msg.checkin={err:'成交組數要附上訂單截圖當證據喔'};render();return;}
    const keepNote=fd.note;
    const r=await post('checkin',{memberId:S.me.id,pin:S.me.pin,story:!!fd.story,note:fd.note,deals:fd.deals||0,proofs:S.proofFiles.map(u=>u.split(',')[1])},'checkin','打卡成功 ✨ 今天也很棒！');
    if(r.ok){S.proofFiles=[];S.ckDraft=null;render();}
    if(!r.ok&&/重新登入/.test(r.error||'')){S.me=null;save('pf_me',null);render();}
  }else if(kind==='adminLogin'){
    S.busy=true;S.msg={};render();
    let r;try{r=await apiPost('verify',{pass:fd.pass});}catch(err){r={ok:false,error:'連線失敗'};}
    if(!CONFIG.API)r=fd.pass==='1234'?{ok:true}:{ok:false,error:'後台密碼不對（示範模式密碼是 1234）'};
    S.busy=false;
    if(r.ok){S.pass=fd.pass;save('pf_pass',fd.pass);apply(r);S.proofsLoaded=false;}else S.msg.admin={err:r.error};
    render();
  }else if(kind==='fb'){
    if(!S.teacher){toast('請先在上方「我是」選擇你的名字');const sel=document.querySelector('select[data-act=teacher]');if(sel){sel.scrollIntoView({block:'center'});sel.focus();}return;}
    await post('feedback',{pass:S.pass,key:f.dataset.k,text:fd.text,by:S.teacher},'fbm','回饋已送出 💬');
  }else if(kind==='saveLesson'){
    await post('saveLesson',{pass:S.pass,day:S.adminDay+1,video:fd.video,extra:fd.extra},'admin','已儲存 ✓');
  }
});
render();refresh();
setInterval(()=>{if(document.visibilityState==='visible'&&!S.busy&&!document.activeElement.matches('input,textarea,select'))refresh();},60000);
</script>
